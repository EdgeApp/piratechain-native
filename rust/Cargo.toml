[package]
name = "piratechain-native-addon"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# No `tokio_rt`: the Pirate service does its own `Runtime::block_on` on a
# process-wide runtime, which panics if it is entered from inside another
# tokio runtime. See src/lib.rs.
napi = { version = "2.16", default-features = false, features = ["napi6"] }
napi-derive = "2.16"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
